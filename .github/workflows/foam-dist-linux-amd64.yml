name: foam-dist-linux-amd64

# phynexis-foam Linux x86_64 发布包（glibc 2.35 基线）on Gitea Actions。
#
# 构建在 ubuntu:22.04 容器里完成（docker/Dockerfile.build），与开发机、CI
# 共用同一条 `make docker-dist-native`。runner 只要求有容器后端（docker /
# podman / apple，见 docker/container-backend.sh），宿主系统不限；当前是
# ts-mac-mini 宿主 + colima Rosetta，label `ci-container:host`。
#
# 帧：build → verify → upload → install-smoke。verify / install-smoke 也都
# 在同一个构建镜像里跑（make docker-verify-pack / docker-install-smoke），
# 因此宿主机不需要是 Linux。
#
# Secrets: XIAOHE_VPS_SSH_KEY（ts-xiaohe）。openfoam-source 是公开 GitLab 子模块，
# checkout 用 runner 自动下发的仓库 token 即可。
on:
  workflow_dispatch:
    inputs:
      upload_only:
        description: Skip build; run upload on the existing drop.
        type: boolean
        default: false
      release_tag:
        description: Version directory on dufs (e.g. v2412.6).
        type: string
        default: v2412.6

permissions:
  contents: read

env:
  GLIBC_FLOOR: "2.35"
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build-linux-amd64:
    name: build-linux-amd64
    if: inputs.upload_only != true && inputs.upload_only != 'true'
    runs-on: ${{ fromJSON(vars.FOAM_CI_RUNNER_LINUX || '"ci-container"') }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build in the ubuntu 22.04 container
        run: make ci-build

      - name: Write build manifest
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          src_sha=$(git submodule status openfoam-source | awk '{print $1}')
          stamp="dev-$(date +%Y%m%d)-g${sha:0:7}"
          python3 - "$stamp" "$sha" "$src_sha" <<'PY'
          import hashlib, json, pathlib, sys
          stamp, sha, src_sha = sys.argv[1:4]
          root = pathlib.Path("docker-build/dist-native")
          arts = {}
          for p in sorted(root.iterdir()):
              if p.is_file():
                  arts[p.name] = "sha256:" + hashlib.sha256(p.read_bytes()).hexdigest()
          manifest = {
              "version": stamp,
              "commit_foam_repo": sha,
              "commit_openfoam_source": src_sha.strip("+"),
              "ubuntu_baseline": "22.04", "glibc_floor": "2.35",
              "built_at": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "builder": "gitea-actions/foam-dist-linux-amd64",
              "container_backend": "make docker-dist-native",
              "artifacts": arts,
          }
          (root / "build-manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Verify pack (glibc floor, ldd, bashrc)
        run: make ci-verify GLIBC_FLOOR="${GLIBC_FLOOR}"

      - name: Drop artifacts for upload
        run: make ci-drop

  upload:
    name: upload
    needs: build-linux-amd64
    if: always() && (inputs.upload_only == true || inputs.upload_only == 'true' || needs.build-linux-amd64.result == 'success')
    runs-on: ${{ fromJSON(vars.FOAM_CI_RUNNER_LINUX || '"ci-container"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Require VPS SSH secret
        env:
          SSH_KEY: ${{ secrets.XIAOHE_VPS_SSH_KEY }}
        run: '[[ -n "${SSH_KEY}" ]] || { echo "Missing secret XIAOHE_VPS_SSH_KEY"; exit 1; }'

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.XIAOHE_VPS_SSH_KEY }}
          XIAOHE_VPS_SSH: ${{ secrets.XIAOHE_VPS_SSH || 'ubuntu@100.64.0.4' }}
          XIAOHE_VPS_SSH_PORT: ${{ secrets.XIAOHE_VPS_SSH_PORT || '22022' }}
        run: bash scripts/ci/gha-prepare-vps-ssh.sh

      - name: Publish to dufs /openfoam/<ver> (glibc gate + prune 3)
        env:
          OPENFOAM_RELEASE_TAG: ${{ inputs.release_tag }}
          KEEP_VERSIONS: "3"
          BUILD_ROOT: docker-build
        run: make ci-upload

  install-smoke:
    name: install-smoke
    needs: upload
    runs-on: ${{ fromJSON(vars.FOAM_CI_RUNNER_LINUX || '"ci-container"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download published pack and run a cavity case (in container)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          OPENFOAM_BASEURL: ${{ secrets.XIAOHE_VPS_PUBLIC_URL || 'https://download.xiaohe.team' }}
        run: make ci-smoke
